<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aahara — Restaurant Manager Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1A1D20;
            --panel-bg: #24282C;
            --primary-color: #D35400;
            --primary-hover: #E67E22;
            --text-color: #ECF0F1;
            --text-muted: #95A5A6;
            --border-color: #343A40;
            --accent-green: #27AE60;
            --accent-red: #E74C3C;
            --font-ui: 'Outfit', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary-color), #E67E22);
            color: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-serif);
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 4px 16px rgba(211, 84, 0, 0.4);
        }

        .brand-header h2 {
            font-family: var(--font-serif);
            font-size: 24px;
            font-weight: 700;
        }

        .brand-header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .error-alert {
            background-color: rgba(231, 76, 60, 0.15);
            border: 1px solid var(--accent-red);
            color: #F1948A;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: #1E2225;
            color: var(--text-color);
            font-size: 14px;
            font-family: var(--font-ui);
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .login-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(211, 84, 0, 0.3);
            margin-top: 6px;
        }

        .login-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .demo-credentials {
            background-color: #1E2225;
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .demo-credentials span {
            color: var(--text-color);
            font-family: monospace;
            font-weight: 700;
        }

        .back-link {
            text-align: center;
            margin-top: 8px;
        }

        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-header">
        <div class="brand-logo">A</div>
        <h2>Aahara Restaurant Portal</h2>
        <p>Kitchen Manager & Order Dispatch Control</p>
    </div>

    {% if error %}
    <div class="error-alert">
        {{ error }}
    </div>
    {% endif %}

    <form class="login-form" action="/admin/login" method="POST">
        <div class="form-group">
            <label for="email">Admin Email</label>
            <input type="email" id="email" name="email" class="form-input" value="Admin@aahara.com" required placeholder="Admin@aahara.com">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" required placeholder="••••••••">
        </div>

        <button type="submit" class="login-btn">Sign In to Restaurant Dashboard</button>
    </form>

    <div class="demo-credentials">
        <div><strong>Default Admin Credentials:</strong></div>
        <div>Email: <span>Admin@aahara.com</span></div>
        <div>Password: <span>Aahara@1939.</span></div>
    </div>

    <div class="back-link">
        <a href="/">← Return to Customer App</a>
    </div>
</div>

</body>
</html>
