<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aahara — Restaurant Manager Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121417;
            --panel-bg: #1A1D21;
            --card-bg: #22262B;
            --primary-color: #D35400;
            --primary-hover: #E67E22;
            --text-color: #ECF0F1;
            --text-muted: #8F9D9D;
            --border-color: #2D3339;
            --accent-green: #27AE60;
            --accent-blue: #2980B9;
            --accent-yellow: #F39C12;
            --accent-red: #E74C3C;
            --font-ui: 'Outfit', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .admin-header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary-color), #E67E22);
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-serif);
            font-size: 24px;
            font-weight: bold;
        }

        .brand-title h1 {
            font-family: var(--font-serif);
            font-size: 20px;
            font-weight: 700;
        }

        .brand-title p {
            font-size: 11px;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-btn {
            background-color: #262B30;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .admin-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* Main Container */
        .admin-container {
            flex: 1;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        /* Analytics Grid */
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .metric-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .metric-title {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-color);
        }

        .metric-value.revenue { color: var(--accent-green); }
        .metric-value.active { color: var(--accent-yellow); }
        .metric-value.delivered { color: var(--accent-blue); }

        /* Main Tabs & Content */
        .tab-bar {
            display: flex;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .nav-tab {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .nav-tab.active {
            background-color: var(--primary-color);
            color: white;
        }

        /* Order Filter Tabs */
        .order-filters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .filter-pill {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-pill.active {
            background-color: var(--card-bg);
            color: var(--text-color);
            border-color: var(--primary-color);
        }

        /* Orders Grid */
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
        }

        .order-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .order-card:hover {
            border-color: var(--primary-color);
        }

        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .order-id {
            font-size: 16px;
            font-weight: 800;
            color: var(--primary-color);
        }

        .status-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .status-preparing { background-color: rgba(243, 156, 18, 0.2); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
        .status-onway { background-color: rgba(41, 128, 185, 0.2); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
        .status-delivered { background-color: rgba(39, 174, 96, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .status-cancelled { background-color: rgba(231, 76, 60, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

        .customer-info {
            background-color: var(--card-bg);
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .customer-info strong { color: var(--text-color); }

        .items-list-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .items-list-table th, .items-list-table td {
            padding: 6px 4px;
            text-align: left;
            border-bottom: 1px dashed var(--border-color);
        }

        .items-list-table th { color: var(--text-muted); font-size: 11px; }

        .order-pricing {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
        }

        .order-total-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-green);
        }

        .status-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .action-btn {
            flex: 1;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .action-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .action-btn.btn-cancel:hover {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
        }

        /* Menu Manager Table */
        .menu-manager-table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--panel-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            font-size: 13px;
        }

        .menu-manager-table th, .menu-manager-table td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .menu-manager-table th {
            background-color: var(--card-bg);
            color: var(--text-muted);
            font-weight: 700;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #3A3F45; transition: .3s; border-radius: 24px;
        }

        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent-green); }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body>

<header class="admin-header">
    <div class="brand-section">
        <div class="brand-logo">A</div>
        <div class="brand-title">
            <h1>Aahara Restaurant Portal</h1>
            <p>● Live Orders Sync Active</p>
        </div>
    </div>

    <div class="header-actions">
        <a href="/" class="admin-btn" target="_blank">🌐 Open Customer App</a>
        <a href="/admin/logout" class="admin-btn" style="color: var(--accent-red);">🚪 Logout</a>
    </div>
</header>

<div class="admin-container">
    <!-- Analytics Grid -->
    <div class="analytics-grid">
        <div class="metric-card">
            <div class="metric-title">Total Revenue</div>
            <div class="metric-value revenue" id="metricRevenue">₹0.00</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Active Orders</div>
            <div class="metric-value active" id="metricActive">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Completed Orders</div>
            <div class="metric-value delivered" id="metricDelivered">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Cancelled Orders</div>
            <div class="metric-value" style="color: var(--accent-red);" id="metricCancelled">0</div>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tab-bar">
        <button class="nav-tab active" onclick="switchTab('orders', this)">📦 Live Orders Board</button>
        <button class="nav-tab" onclick="switchTab('menu', this)">🍽️ Menu Manager</button>
    </div>

    <!-- Orders Tab Section -->
    <div id="ordersTabSection">
        <div class="order-filters">
            <button class="filter-pill active" onclick="filterStatus('all', this)">All Orders</button>
            <button class="filter-pill" onclick="filterStatus('Preparing', this)">👨‍🍳 Preparing</button>
            <button class="filter-pill" onclick="filterStatus('Out for Delivery', this)">🛵 Out for Delivery</button>
            <button class="filter-pill" onclick="filterStatus('Delivered', this)">🎉 Delivered</button>
            <button class="filter-pill" onclick="filterStatus('Cancelled', this)">❌ Cancelled</button>
        </div>

        <div class="orders-grid" id="ordersGrid">
            <!-- Order Cards Rendered via JS Polling -->
        </div>
    </div>

    <!-- Menu Manager Tab Section -->
    <div id="menuTabSection" style="display: none;">
        <table class="menu-manager-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Item Name</th>
                    <th>Category</th>
                    <th>Dietary</th>
                    <th>Price (₹)</th>
                    <th>Rating</th>
                    <th>In Stock Status</th>
                </tr>
            </thead>
            <tbody id="menuTableBody">
                <!-- Rendered via JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let ordersCache = [];
    let currentFilterStatus = 'all';

    document.addEventListener("DOMContentLoaded", () => {
        fetchAdminOrders();
        fetchAdminMenu();
        setInterval(fetchAdminOrders, 5000);
    });

    async function fetchAdminOrders() {
        try {
            const res = await fetch("/admin/api/orders");
            const data = await res.json();
            if (data.success) {
                ordersCache = data.orders || [];
                updateAnalytics(data.analytics || {});
                renderOrdersGrid();
            }
        } catch (e) {
            console.error("Error fetching admin orders:", e);
        }
    }

    function updateAnalytics(analytics) {
        document.getElementById("metricRevenue").innerText = `₹${(analytics.total_revenue || 0).toFixed(2)}`;
        document.getElementById("metricActive").innerText = analytics.active_orders || 0;
        document.getElementById("metricDelivered").innerText = analytics.delivered_orders || 0;
        document.getElementById("metricCancelled").innerText = analytics.cancelled_orders || 0;
    }

    function renderOrdersGrid() {
        const grid = document.getElementById("ordersGrid");
        grid.innerHTML = "";

        const filtered = ordersCache.filter(o => {
            if (currentFilterStatus === 'all') return true;
            return o.status === currentFilterStatus;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No orders found matching filter '${currentFilterStatus}'.</div>`;
            return;
        }

        filtered.forEach(o => {
            const card = document.createElement("div");
            card.className = "order-card";

            let badgeClass = "status-preparing";
            if (o.status === "Out for Delivery") badgeClass = "status-onway";
            else if (o.status === "Delivered") badgeClass = "status-delivered";
            else if (o.status === "Cancelled") badgeClass = "status-cancelled";

            let itemsRows = "";
            if (o.items && Array.isArray(o.items)) {
                o.items.forEach(i => {
                    itemsRows += `<tr><td>${i.name}</td><td>x${i.quantity}</td><td style="text-align:right;">₹${i.subtotal}</td></tr>`;
                });
            }

            const cName = o.customer_name || 'Valued Customer';
            const cPhone = o.customer_phone || 'N/A';
            const cAddr = o.delivery_address || 'Dine-in / Pickup';
            const notes = o.notes ? `<div style="color:var(--accent-yellow); margin-top:4px;">📝 <strong>Notes:</strong> ${o.notes}</div>` : '';
            const promo = o.promo_code ? `<span style="color:var(--accent-green);">🎟️ ${o.promo_code} (-₹${o.discount})</span>` : '';

            card.innerHTML = `
                <div class="order-card-header">
                    <span class="order-id">Order #${o.order_id}</span>
                    <span class="status-badge ${badgeClass}">${o.status}</span>
                </div>

                <div class="customer-info">
                    <div>👤 <strong>${cName}</strong> (📞 ${cPhone})</div>
                    <div>📍 <strong>Address:</strong> ${cAddr}</div>
                    ${notes}
                </div>

                <table class="items-list-table">
                    <thead><tr><th>Item</th><th>Qty</th><th style="text-align:right;">Price</th></tr></thead>
                    <tbody>${itemsRows}</tbody>
                </table>

                <div class="order-pricing">
                    <div>${promo}</div>
                    <div>Total: <span class="order-total-price">₹${o.total}</span></div>
                </div>

                <div class="status-actions">
                    <button class="action-btn" onclick="updateStatus(${o.order_id}, 'Preparing')">👨‍🍳 Preparing</button>
                    <button class="action-btn" onclick="updateStatus(${o.order_id}, 'Out for Delivery')">🛵 Out for Delivery</button>
                    <button class="action-btn" onclick="updateStatus(${o.order_id}, 'Delivered')">🎉 Delivered</button>
                    <button class="action-btn btn-cancel" onclick="updateStatus(${o.order_id}, 'Cancelled')">❌ Cancel</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    async function updateStatus(orderId, newStatus) {
        try {
            const res = await fetch("/admin/api/order/status", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ order_id: orderId, status: newStatus })
            });
            const data = await res.json();
            if (data.success) {
                fetchAdminOrders();
            } else {
                alert(data.message || "Failed to update status.");
            }
        } catch (e) {
            console.error("Status update error:", e);
        }
    }

    function filterStatus(status, btn) {
        currentFilterStatus = status;
        document.querySelectorAll(".filter-pill").forEach(p => p.classList.remove("active"));
        if (btn) btn.classList.add("active");
        renderOrdersGrid();
    }

    function switchTab(tabName, btn) {
        document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
        if (btn) btn.classList.add("active");

        if (tabName === 'orders') {
            document.getElementById("ordersTabSection").style.display = "block";
            document.getElementById("menuTabSection").style.display = "none";
        } else {
            document.getElementById("ordersTabSection").style.display = "none";
            document.getElementById("menuTabSection").style.display = "block";
            fetchAdminMenu();
        }
    }

    async function fetchAdminMenu() {
        try {
            const res = await fetch("/admin/api/menu");
            const data = await res.json();
            if (data.found && data.items) {
                renderMenuTable(data.items);
            }
        } catch (e) {
            console.error("Admin menu fetch error:", e);
        }
    }

    function renderMenuTable(items) {
        const tbody = document.getElementById("menuTableBody");
        tbody.innerHTML = "";
        items.forEach(item => {
            const tr = document.createElement("tr");
            const vegBadge = item.is_veg === 1 ? '<span style="color:var(--accent-green); font-weight:700;">🌱 Veg</span>' : '<span style="color:var(--accent-red); font-weight:700;">🍗 Non-Veg</span>';
            const checked = item.available === 1 ? 'checked' : '';

            tr.innerHTML = `
                <td>#${item.id}</td>
                <td><strong>${item.name}</strong></td>
                <td>${item.category}</td>
                <td>${vegBadge}</td>
                <td>₹${item.price}</td>
                <td>⭐ ${item.rating || 4.5}</td>
                <td>
                    <label class="toggle-switch">
                        <input type="checkbox" ${checked} onchange="toggleMenuStock(${item.id}, this.checked)">
                        <span class="slider"></span>
                    </label>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function toggleMenuStock(itemId, isChecked) {
        try {
            await fetch("/admin/api/menu/toggle", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ item_id: itemId, available: isChecked ? 1 : 0 })
            });
        } catch (e) {
            console.error("Toggle stock error:", e);
        }
    }
</script>
</body>
</html>
